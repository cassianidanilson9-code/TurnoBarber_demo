name: Deploy a EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copiar archivos a la EC2
        run: |
          rsync -az --exclude node_modules --exclude dist --exclude .env \
            turnobarber/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/TurnoBarber_demo/turnobarber/

      - name: Compilar y reiniciar la app
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "bash -lc 'cd ~/TurnoBarber_demo/turnobarber && npm install && npm run build && pm2 restart turnobarber'"